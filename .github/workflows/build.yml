name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained exe
        run: dotnet publish src/OscpointHelper.csproj -c Release -o out

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: OSCPointHelper
          path: out/OSCPointHelper.exe

      - name: Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/OSCPointHelper.exe
