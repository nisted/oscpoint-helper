name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the exe to this existing release tag (e.g. v0.1.0); blank = just build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained exe
        run: dotnet publish src/OscpointHelper.csproj -c Release -o out

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: OSCPointHelper
          path: out/OSCPointHelper.exe

      - name: Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/OSCPointHelper.exe
